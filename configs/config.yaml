# Single source of truth for fer_training's hyperparameters.
# Paths are NOT configured here - they're derived from the `artifacts`
# package's shared location constants (see fer_training/config/loader.py),
# so every package in the repo (fer_training, fer_server, attacks, defenses)
# agrees on where data/checkpoints/results live.

seed: 42

data:
  num_classes: 7
  class_names: [angry, disgust, fear, happy, neutral, sad, surprise]
  val_fraction: 0.1        # carved out of the train split
  batch_size: 64
  num_workers: 0           # Windows-safe default; bump if running on Linux/macOS

simple_cnn:
  image_size: 48
  grayscale: true
  epochs: 50               # val accuracy was still improving at epoch 30 with no scheduler
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 8   # > lr_scheduler_patience, so an LR drop gets a chance to help first
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  checkpoint_name: simple_cnn.pt

resnet_finetune:
  image_size: 224
  epochs: 20               # val accuracy hadn't plateaued by epoch 10
  lr: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 6   # > lr_scheduler_patience, so an LR drop gets a chance to help first
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  unfrozen_layers: [layer4, fc]   # everything else in resnet18 stays frozen
  checkpoint_name: resnet18_finetuned.pt

preprocessing:
  # Train-time augmentation (never applied to val/test) - counters the
  # overfitting seen when training on unaugmented FER2013.
  use_augmentation: true
  horizontal_flip_probability: 0.5
  rotation_degrees: 15
  random_erasing_probability: 0.25
  # Class-imbalance handling - two alternative approaches, don't enable both
  # at once (they'd double-correct for the same imbalance).
  use_class_weights: true
  use_weighted_sampler: false
  # Raw inverse-frequency weighting (1.0) fixed "disgust" recall but tanked
  # its precision by over-predicting it. 0.5 (square root) softens the boost.
  class_weight_power: 0.5
